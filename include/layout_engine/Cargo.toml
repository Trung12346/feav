[package]
name = "feav_layout"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
taffy = { version = "=0.15.0", default-features = false, features = [
    "std", "flexbox", "grid", "block_layout", "calc", "content_size",
] }

[profile.release]
panic = "abort"
lto = true